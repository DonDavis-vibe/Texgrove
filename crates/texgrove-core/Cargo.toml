[package]
name = "texgrove-core"
description = "Texgrove's mesh kernel: welding, topology, normals, subdivision, displacement, decimation, STL and 3MF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
libm.workspace = true
thiserror.workspace = true
zip = { workspace = true, optional = true }
png = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }

[features]
default = ["threemf", "pictures"]
# The 3MF writer (a zip package).
threemf = ["dep:zip"]
# Pictures (PNG, JPEG) as textures.
pictures = ["dep:png", "dep:zune-jpeg"]

[dev-dependencies]
zip.workspace = true
