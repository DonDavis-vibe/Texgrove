[package]
name = "texgrove-plugin"
description = "Texgrove as a Meshgrove plugin: textures as real geometry on library models"
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Davis (German Redneck Engineering)"]
homepage = "https://redneck-design.de/"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
texgrove-core = { path = "../texgrove-core" }
# The plugin API of Meshgrove 0.9.0 (API 0.2). To build against a local checkout of Meshgrove
# instead (for an API that is not tagged yet), put
#   [patch."https://github.com/DonDavis-vibe/MeshGrove"]
#   meshgrove-plugin-api = { path = "/path/to/MeshGrove/crates/meshgrove-plugin-api" }
# into crates/texgrove-plugin/local-api.toml (not committed); scripts/build.sh and check.sh pass
# it to cargo.
meshgrove-plugin-api = { git = "https://github.com/DonDavis-vibe/MeshGrove", tag = "v0.9.0", features = ["guest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = { version = "0.18", default-features = false }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Not part of the native workspace: built for wasm32-wasip2 (scripts/build.sh).
[workspace]
