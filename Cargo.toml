[workspace]
resolver = "3"
members = ["crates/texgrove-core", "crates/texgrove-cli"]
# The plugin is a wasm32-wasip2 cdylib with its own lock file; scripts/build.sh builds it.
exclude = ["crates/texgrove-plugin"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Davis (German Redneck Engineering)"]
homepage = "https://redneck-design.de/"
description = "Displacement textures for 3D-print meshes: knurls, weaves, wood and more as real geometry"
publish = false

[workspace.dependencies]
texgrove-core = { path = "crates/texgrove-core" }
# Transcendental functions in software: the same bits natively and in wasm.
libm = "0.2"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
png = { version = "0.18", default-features = false }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.texgrove-core]
# Mesh work on millions of triangles is unusable unoptimized.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
